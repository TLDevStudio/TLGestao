  <script type="text/javascript">
    // Single Page Apps for GitHub Pages — reconstrói a rota real
    // (ex: /admin/dashboard) a partir da query string que o
    // public/404.html criou, antes do React Router montar.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(
          null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
